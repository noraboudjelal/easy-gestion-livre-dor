name: Harmonize Le Fil game cards

on:
  push:
    paths:
      - '.github/workflows/lehnova-harmonize-games-style.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Harmonize wheel and outfit styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/[slug]/page.js')
          s = p.read_text()
          replacements = {
'''    wheelCard: {
      background: "linear-gradient(150deg, #FF6B6B 0%, #A78BFA 55%, #4ECDC4 100%)",
      border: "none",
      borderRadius: "26px",
      padding: "20px",
      marginBottom: "22px",
      boxShadow: "0 14px 30px -12px rgba(167,139,250,0.5)",
    },
    wheelTitle: { fontFamily: "'Fredoka', sans-serif", fontWeight: 700, fontSize: "1.5rem", color: "#fff", margin: "0 0 4px", textShadow: "0 2px 0 rgba(0,0,0,0.12)" },''': '''    wheelCard: {
      background: t.cardGradient || t.surface,
      border: `1px solid ${t.borderColor || t.accent}`,
      borderRadius: "18px",
      padding: "20px",
      marginBottom: "22px",
      boxShadow: "0 8px 24px rgba(0,0,0,0.08)",
    },
    wheelTitle: { fontFamily: "Georgia, serif", fontWeight: 600, fontSize: "1.35rem", color: t.ivory, margin: "0 0 5px" },''',
'''    wheelSub: { fontFamily: "'Fredoka', sans-serif", fontSize: "0.82rem", color: "rgba(255,255,255,0.92)", margin: "0 0 14px", fontWeight: 500 },''': '''    wheelSub: { fontFamily: "inherit", fontSize: "0.86rem", color: t.muted, margin: "0 0 14px", fontWeight: 500 },''',
'''    wheelAddBtn: { fontFamily: "'Fredoka', sans-serif", fontWeight: 700, fontSize: "0.85rem", padding: "0 18px", background: "#241a15", color: "#FFD93D", border: "none", borderRadius: "16px" },''': '''    wheelAddBtn: { fontFamily: "inherit", fontWeight: 700, fontSize: "0.85rem", padding: "0 18px", background: t.actionBackground || t.button || t.accent, color: t.actionText || "#fff", border: "none", borderRadius: "12px" },''',
'''      background: "#FFD93D",
      color: "#241a15",
      border: "none",
      borderRadius: "999px",
      cursor: "pointer",
      boxShadow: "0 6px 0 #C9A22E, 0 10px 18px -6px rgba(0,0,0,0.35)",''': '''      background: t.actionBackground || t.button || t.accent,
      color: t.actionText || "#fff",
      border: "none",
      borderRadius: "12px",
      cursor: "pointer",
      boxShadow: "0 5px 14px rgba(0,0,0,0.12)",''',
'''    lookCard: {
      background: "linear-gradient(150deg, #FF9F45 0%, #FF6FB5 55%, #A78BFA 100%)",
      border: "none",
      borderRadius: "26px",
      padding: "20px",
      marginBottom: "22px",
      boxShadow: "0 14px 30px -12px rgba(255,111,181,0.5)",
    },
    lookTitle: { fontFamily: "'Fredoka', sans-serif", fontWeight: 700, fontSize: "1.5rem", color: "#fff", margin: "0 0 4px", textShadow: "0 2px 0 rgba(0,0,0,0.12)" },
    lookSub: { fontFamily: "'Fredoka', sans-serif", fontSize: "0.82rem", color: "rgba(255,255,255,0.92)", margin: "0 0 14px", fontWeight: 500 },''': '''    lookCard: {
      background: t.cardGradient || t.surface,
      border: `1px solid ${t.borderColor || t.accent}`,
      borderRadius: "18px",
      padding: "20px",
      marginBottom: "22px",
      boxShadow: "0 8px 24px rgba(0,0,0,0.08)",
    },
    lookTitle: { fontFamily: "Georgia, serif", fontWeight: 600, fontSize: "1.35rem", color: t.ivory, margin: "0 0 5px" },
    lookSub: { fontFamily: "inherit", fontSize: "0.86rem", color: t.muted, margin: "0 0 14px", fontWeight: 500 },''',
'''      background: "#241a15",
      color: "#FFD93D",
      border: "none",
      borderRadius: "999px",
      cursor: "pointer",
      boxShadow: "0 5px 0 #000, 0 9px 16px -6px rgba(0,0,0,0.35)",''': '''      background: t.actionBackground || t.button || t.accent,
      color: t.actionText || "#fff",
      border: "none",
      borderRadius: "12px",
      cursor: "pointer",
      boxShadow: "0 5px 14px rgba(0,0,0,0.12)",'''
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit('Expected style block not found; no changes made')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "Lehnova Bot"
          git config user.email "actions@users.noreply.github.com"
          git add 'app/[slug]/page.js'
          git diff --cached --quiet && exit 0
          git commit -m "Harmonize wheel and outfit cards with event theme"
          git push origin main
